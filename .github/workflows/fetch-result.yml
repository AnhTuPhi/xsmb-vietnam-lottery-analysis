name: Fetching Result

on:
  schedule:
    - cron: 35 11 * * * # 6:35 PM in Vietnam

jobs:
  fetch-result:
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - name: checkout repo content
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install python packages
        run: |
          pip install -r requirements.txt

      - name: fetch data
        run: python src/analyze/fetch.py

      - name: get current date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: push changes
        uses: actions-x/commit@v6
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          message: Fetch result at ${{ env.date }}
          email: action@github.com
          name: GitHub Action
  notify-result:
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - name: checkout repo content
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install python packages
        run: |
          pip install -r requirements.txt

      - name: notify result to telegram private group
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/notifications/notification-result.py
