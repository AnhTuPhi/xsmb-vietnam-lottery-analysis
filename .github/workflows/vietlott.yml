name: Vietlott Fetch

on:
  schedule:
    # Vietnam is UTC+7. Draws complete by ~18:30 VN = 11:30 UTC.
    # We schedule for 12:00 UTC = 19:00 VN to be safe.
    # Power 6/55: Tue / Thu / Sat   (weekdays 2,4,6 in cron — Sunday=0)
    # Mega 6/45 : Wed / Fri / Sun   (weekdays 3,5,0)
    # Lotto 5/35: draws daily; products_for_today filters per draw_days.
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-24.04
    environment: secrets
    steps:
      - name: checkout repo content
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: install python packages
        run: pip install -r requirements.txt

      # GitHub Actions' Azure datacenter IPs are blocked by Vietlott's
      # Cloudflare WAF (403). WARP routes traffic through a Cloudflare
      # consumer IP that is not on that datacenter blocklist.
      - name: install cloudflare warp
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

      - name: connect warp
        run: |
          # warp-svc is auto-started by the package; give it a moment.
          for i in $(seq 1 10); do
            if systemctl is-active --quiet warp-svc; then echo active; break; fi
            sleep 1
          done
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos mode warp
          sudo warp-cli --accept-tos connect
          # Runners are IPv4-only until WARP brings up its tunnel, so a curl
          # trace can't confirm readiness — gate on warp-cli's own status.
          connected=false
          for i in $(seq 1 20); do
            status=$(sudo warp-cli --accept-tos status 2>/dev/null || true)
            echo "warp status: $status"
            if echo "$status" | grep -q "Connected"; then
              connected=true; break
            fi
            sleep 3
          done
          if [ "$connected" != true ]; then
            echo "WARP failed to connect"; exit 1
          fi
          echo "=== Direct IP (no proxy) ==="
          curl -s -4 https://www.cloudflare.com/cdn-cgi/trace/ | grep -E "ip=|warp=" || true
          echo "=== WARP exit IP ==="
          curl -s https://www.cloudflare.com/cdn-cgi/trace/ | grep -E "ip=|warp=" || true

      - name: run vietlott pipeline
        run: python src/vietlott_fetch.py
        env:
          VIETLOTT_PROXY: ${{ secrets.VIETLOTT_PROXY }}

      - name: get current date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: push changes
        uses: actions-x/commit@v6
        with:
          token: ${{ secrets.MY_GITHUB_TOKEN }}
          message: "Vietlott ${{ env.date }}"
          email: action@github.com
          name: GitHub Action
          files: data/vietlott-*.json data/vietlott-*.csv data/vietlott-*.parquet
